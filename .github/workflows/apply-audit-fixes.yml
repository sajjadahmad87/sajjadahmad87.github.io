name: Apply site audit fixes

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-audit-fixes.yml'

permissions:
  contents: write

jobs:
  apply-fixes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply audit fixes
        run: python3 scripts/apply_site_audit_fixes.py
      - name: Remove one-time repair files
        run: rm -f scripts/apply_site_audit_fixes.py .github/workflows/apply-audit-fixes.yml
      - name: Commit fixes
        run: |
          git config user.name "sajjadahmad87"
          git config user.email "engr.sajjad87@gmail.com"
          git add -A
          git commit -m "Apply website audit fixes"
          git push
