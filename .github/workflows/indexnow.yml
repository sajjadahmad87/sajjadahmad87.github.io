name: Notify IndexNow of public page changes

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  notify-indexnow:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Submit changed public URLs to IndexNow
        shell: bash
        env:
          INDEXNOW_KEY: 69013aae15122e0c1a75cb637b24eee7
          SITE_ORIGIN: https://sajjadengineeringacademy.com
        run: |
          set -euo pipefail

          if git rev-parse HEAD^ >/dev/null 2>&1; then
            changed_files="$(git diff --name-only HEAD^ HEAD)"
          else
            changed_files="$(git ls-tree -r --name-only HEAD)"
          fi

          declare -A urls=()

          url_for_file() {
            local file="$1"
            case "$file" in
              index.html)
                printf '%s/\n' "$SITE_ORIGIN"
                ;;
              */index.html)
                local path="${file%index.html}"
                printf '%s/%s\n' "$SITE_ORIGIN" "$path"
                ;;
              *.html)
                printf '%s/%s\n' "$SITE_ORIGIN" "$file"
                ;;
            esac
          }

          sitemap_contains() {
            local sitemap_ref="$1"
            local url="$2"
            git show "$sitemap_ref:sitemap.xml" 2>/dev/null | grep -Fq "<loc>$url</loc>"
          }

          while IFS= read -r file; do
            [[ -n "$file" ]] || continue
            url="$(url_for_file "$file" || true)"
            [[ -n "$url" ]] || continue

            # For existing/new pages, the current sitemap is the source of truth for
            # indexability. For deleted pages, the previous sitemap confirms that the
            # removed URL used to be public/indexable and should be reported as changed.
            if [[ -e "$file" ]]; then
              if sitemap_contains HEAD "$url"; then
                urls["$url"]=1
              fi
            elif git rev-parse HEAD^ >/dev/null 2>&1 && sitemap_contains HEAD^ "$url"; then
              urls["$url"]=1
            fi
          done <<< "$changed_files"

          if [[ ${#urls[@]} -eq 0 ]]; then
            echo "No changed sitemap-listed public URLs to submit."
            exit 0
          fi

          printf '%s\n' "${!urls[@]}" | sort > /tmp/indexnow-urls.txt

          python3 - <<'PY'
          import json
          import os

          with open('/tmp/indexnow-urls.txt', encoding='utf-8') as fh:
              urls = [line.strip() for line in fh if line.strip()]

          payload = {
              'host': 'sajjadengineeringacademy.com',
              'key': os.environ['INDEXNOW_KEY'],
              'urlList': urls,
          }

          with open('/tmp/indexnow-payload.json', 'w', encoding='utf-8') as fh:
              json.dump(payload, fh, ensure_ascii=False)
          PY

          status="$(curl -sS -o /tmp/indexnow-response.txt -w '%{http_code}' \
            -H 'Content-Type: application/json; charset=utf-8' \
            --data-binary @/tmp/indexnow-payload.json \
            https://api.indexnow.org/indexnow || true)"

          if [[ "$status" == "200" || "$status" == "202" ]]; then
            echo "IndexNow accepted ${#urls[@]} changed public URL(s) (HTTP $status)."
          else
            echo "IndexNow batch submission failed for ${#urls[@]} URL(s) (HTTP $status)."
            cat /tmp/indexnow-response.txt || true
            exit 1
          fi
