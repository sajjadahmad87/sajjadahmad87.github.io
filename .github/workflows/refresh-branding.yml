name: Refresh academy branding
on:
  push:
    paths:
      - '.github/workflows/refresh-branding.yml'
permissions:
  contents: write
jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          old="Sajjad Engineering Academy"
          new="Sajjad's Engineering Academy"
          wf=Path('.github/workflows/refresh-branding.yml')
          for p in Path('.').rglob('*'):
              if not p.is_file() or '.git' in p.parts or p==wf:
                  continue
              try: t=p.read_text(encoding='utf-8')
              except Exception: continue
              if old in t:
                  p.write_text(t.replace(old,new),encoding='utf-8')
          PY
          rm -f .github/workflows/refresh-branding.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Keep Sajjad's Engineering Academy branding consistent"
          git push
