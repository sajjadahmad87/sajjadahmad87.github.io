name: Repository hygiene

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secret-hygiene:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Scan public text files for high-confidence secret patterns
        shell: python
        run: |
          from pathlib import Path
          import re
          import sys

          text_extensions = {
              '.html', '.htm', '.js', '.css', '.json', '.md', '.txt', '.xml',
              '.yml', '.yaml', '.webmanifest', '.svg'
          }
          excluded_roots = {'.git'}

          patterns = {
              'private key material': re.compile(r'-----BEGIN (?:RSA |EC |OPENSSH |DSA )?PRIVATE KEY-----'),
              'GitHub personal access token': re.compile(r'\b(?:ghp|gho|ghu|ghs|ghr)_[A-Za-z0-9]{30,}\b'),
              'GitHub fine-grained token': re.compile(r'\bgithub_pat_[A-Za-z0-9_]{40,}\b'),
              'OpenAI API key': re.compile(r'\bsk-(?:proj-)?[A-Za-z0-9_-]{20,}\b'),
              'Google API key': re.compile(r'\bAIza[0-9A-Za-z_-]{30,}\b'),
              'AWS access key': re.compile(r'\b(?:AKIA|ASIA)[0-9A-Z]{16}\b'),
              'Slack token': re.compile(r'\bxox[baprs]-[A-Za-z0-9-]{10,}\b'),
              'Stripe live secret key': re.compile(r'\bsk_live_[0-9A-Za-z]{20,}\b'),
          }

          findings = []
          for path in Path('.').rglob('*'):
              if not path.is_file() or any(part in excluded_roots for part in path.parts):
                  continue
              if path.suffix.lower() not in text_extensions:
                  continue
              try:
                  text = path.read_text(encoding='utf-8')
              except UnicodeDecodeError:
                  continue
              for line_number, line in enumerate(text.splitlines(), start=1):
                  for label, pattern in patterns.items():
                      if pattern.search(line):
                          findings.append((str(path), line_number, label))

          if findings:
              print('Potential secret material detected. Remove or rotate it before publishing:')
              for path, line_number, label in findings:
                  print(f'  - {path}:{line_number}: {label}')
              sys.exit(1)

          print('Repository hygiene check passed: no high-confidence secret patterns found in public text files.')
