name: Validate downloadable resource links

on:
  push:
    branches: [main]
    paths:
      - 'downloads/**'
      - 'resource-library/**'
      - 'resources.html'
      - '.github/workflows/download-link-health.yml'
  pull_request:
    paths:
      - 'downloads/**'
      - 'resource-library/**'
      - 'resources.html'
      - '.github/workflows/download-link-health.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-download-links:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify referenced download files exist
        shell: bash
        run: |
          python3 - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          from urllib.parse import urlparse, unquote
          import sys

          ROOT = Path('.').resolve()
          DOWNLOADS = (ROOT / 'downloads').resolve()
          errors = []
          checked = 0

          class Parser(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.hrefs = []

              def handle_starttag(self, tag, attrs):
                  if tag != 'a':
                      return
                  attrs = dict(attrs)
                  href = attrs.get('href')
                  if href:
                      self.hrefs.append(href)

          for html_file in ROOT.rglob('*.html'):
              parser = Parser()
              parser.feed(html_file.read_text(encoding='utf-8', errors='ignore'))

              for raw_href in parser.hrefs:
                  parsed = urlparse(raw_href)
                  if parsed.scheme or parsed.netloc:
                      continue

                  path_text = unquote(parsed.path)
                  if not path_text:
                      continue

                  if path_text.startswith('/'):
                      target = (ROOT / path_text.lstrip('/')).resolve()
                  else:
                      target = (html_file.parent / path_text).resolve()

                  try:
                      target.relative_to(DOWNLOADS)
                  except ValueError:
                      continue

                  checked += 1
                  if not target.is_file():
                      errors.append(
                          f'{html_file.relative_to(ROOT)}: missing downloadable resource {raw_href!r}'
                      )

          if errors:
              print('Download-link validation failed:')
              for error in errors:
                  print(f'  - {error}')
              sys.exit(1)

          print(f'Download-link validation passed: {checked} referenced downloadable files checked.')
          PY

      - name: Ensure removed chiller resource library stays removed
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import sys

          ROOT = Path('.').resolve()
          forbidden_paths = [
              ROOT / 'downloads' / 'chiller',
              ROOT / 'resource-library' / 'chiller.html',
          ]
          forbidden_references = (
              'downloads/chiller/',
              '/downloads/chiller/',
              'resource-library/chiller.html',
              '/resource-library/chiller.html',
          )
          errors = []

          for path in forbidden_paths:
              if path.exists():
                  errors.append(f'forbidden removed chiller resource path exists: {path.relative_to(ROOT)}')

          for html_file in ROOT.rglob('*.html'):
              text = html_file.read_text(encoding='utf-8', errors='ignore')
              for reference in forbidden_references:
                  if reference in text:
                      errors.append(
                          f'{html_file.relative_to(ROOT)}: references removed chiller resource path {reference!r}'
                      )

          if errors:
              print('Removed chiller-resource guard failed:')
              for error in errors:
                  print(f'  - {error}')
              sys.exit(1)

          print('Removed chiller-resource guard passed.')
          PY
