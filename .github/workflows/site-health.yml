name: Validate site links and sitemap

on:
  push:
    branches: [main]
    paths:
      - '**/*.html'
      - '**/*.css'
      - '**/*.js'
      - 'sitemap.xml'
      - 'robots.txt'
      - '.github/workflows/site-health.yml'
  pull_request:
    paths:
      - '**/*.html'
      - '**/*.css'
      - '**/*.js'
      - 'sitemap.xml'
      - 'robots.txt'
      - '.github/workflows/site-health.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-site:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate links, anchors, canonicals and sitemap coverage
        shell: bash
        run: |
          python3 - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          from urllib.parse import urlparse, unquote
          import xml.etree.ElementTree as ET
          import sys

          ROOT = Path('.').resolve()
          SITE_HOST = 'sajjadengineeringacademy.com'
          SITE_ORIGIN = f'https://{SITE_HOST}'
          errors = []

          class LinkParser(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.links = []
                  self.ids = []
                  self.canonicals = []
                  self.robots = []

              def handle_starttag(self, tag, attrs):
                  attrs = dict(attrs)
                  if attrs.get('id'):
                      self.ids.append(attrs['id'])
                  if tag == 'a' and attrs.get('name'):
                      self.ids.append(attrs['name'])
                  if tag == 'a' and attrs.get('href'):
                      self.links.append(('href', attrs['href']))
                  elif tag in {'img', 'script', 'iframe', 'source'} and attrs.get('src'):
                      self.links.append(('src', attrs['src']))
                  elif tag == 'link' and attrs.get('href'):
                      self.links.append(('href', attrs['href']))

                  if tag == 'link' and attrs.get('href'):
                      rel = {part.lower() for part in attrs.get('rel', '').split()}
                      if 'canonical' in rel:
                          self.canonicals.append(attrs['href'].strip())

                  if tag == 'meta' and attrs.get('content'):
                      name = attrs.get('name', '').strip().lower()
                      if name in {'robots', 'googlebot', 'bingbot'}:
                          self.robots.extend(
                              token.strip().lower()
                              for token in attrs['content'].split(',')
                              if token.strip()
                          )

          def candidate_targets(path_text, source_file=None):
              path_text = unquote(path_text)
              if path_text in {'', '/'}:
                  return [ROOT / 'index.html']
              if path_text.startswith('/'):
                  base = ROOT / path_text.lstrip('/')
              else:
                  base = (source_file.parent / path_text) if source_file else (ROOT / path_text)
              candidates = [base]
              if path_text.endswith('/'):
                  candidates.append(base / 'index.html')
              elif not Path(path_text).suffix:
                  candidates.extend([Path(str(base) + '.html'), base / 'index.html'])
              return candidates

          def resolve_existing_target(path_text, source_file=None):
              for candidate in candidate_targets(path_text, source_file):
                  resolved = candidate.resolve()
                  try:
                      resolved.relative_to(ROOT)
                  except ValueError:
                      continue
                  if resolved.is_file():
                      return resolved
              return None

          def local_parts_from_url(raw):
              parsed = urlparse(raw)
              if parsed.scheme in {'mailto', 'tel', 'javascript', 'data'}:
                  return None
              if parsed.scheme in {'http', 'https'}:
                  if parsed.netloc.lower() not in {SITE_HOST, f'www.{SITE_HOST}'}:
                      return None
                  return (parsed.path or '/', parsed.fragment)
              if parsed.netloc:
                  return None
              return (parsed.path, parsed.fragment)

          def normalize_public_url(url):
              parsed = urlparse(url)
              path = parsed.path or '/'
              if path == '/index.html':
                  path = '/'
              return f'{SITE_ORIGIN}{path}'

          def public_url_for_file(html_file):
              rel = html_file.relative_to(ROOT).as_posix()
              if rel == 'index.html':
                  path = '/'
              elif rel.endswith('/index.html'):
                  path = '/' + rel[:-10]
              else:
                  path = '/' + rel
              return normalize_public_url(f'{SITE_ORIGIN}{path}')

          html_files = sorted(ROOT.rglob('*.html'))
          parsed_pages = {}
          checked_links = 0
          checked_anchors = 0

          for html_file in html_files:
              parser = LinkParser()
              try:
                  parser.feed(html_file.read_text(encoding='utf-8', errors='ignore'))
              except Exception as exc:
                  errors.append(f'{html_file.relative_to(ROOT)}: could not parse HTML: {exc}')
                  continue

              duplicates = sorted({item for item in parser.ids if parser.ids.count(item) > 1})
              for duplicate in duplicates:
                  errors.append(f'{html_file.relative_to(ROOT)}: duplicate anchor/id {duplicate!r}')

              parsed_pages[html_file.resolve()] = {
                  'links': parser.links,
                  'ids': set(parser.ids),
                  'canonicals': parser.canonicals,
                  'robots': set(parser.robots),
              }

          for html_file, page in parsed_pages.items():
              for kind, raw in page['links']:
                  if not raw:
                      continue
                  parts = local_parts_from_url(raw)
                  if parts is None:
                      continue
                  path_text, fragment = parts

                  if path_text == '':
                      target_file = html_file
                  else:
                      target_file = resolve_existing_target(path_text, html_file)
                      checked_links += 1
                      if target_file is None:
                          errors.append(
                              f'{html_file.relative_to(ROOT)}: broken internal {kind} {raw!r}'
                          )
                          continue

                  if fragment and target_file.suffix.lower() == '.html':
                      checked_anchors += 1
                      target_page = parsed_pages.get(target_file.resolve())
                      target_ids = target_page['ids'] if target_page else set()
                      if unquote(fragment) not in target_ids:
                          errors.append(
                              f'{html_file.relative_to(ROOT)}: broken anchor {raw!r} '
                              f'(missing #{unquote(fragment)} in {target_file.relative_to(ROOT)})'
                          )

          sitemap = ROOT / 'sitemap.xml'
          sitemap_count = 0
          sitemap_urls = set()
          if not sitemap.is_file():
              errors.append('sitemap.xml is missing')
          else:
              try:
                  tree = ET.parse(sitemap)
                  ns = {'sm': 'http://www.sitemaps.org/schemas/sitemap/0.9'}
                  locs = tree.findall('.//sm:loc', ns)
                  if not locs:
                      locs = tree.findall('.//loc')

                  for loc in locs:
                      url = (loc.text or '').strip()
                      if not url:
                          errors.append('sitemap.xml contains an empty <loc>')
                          continue
                      parsed = urlparse(url)
                      if parsed.scheme != 'https' or parsed.netloc.lower() != SITE_HOST:
                          errors.append(f'sitemap.xml has non-canonical URL: {url}')
                          continue

                      normalized_url = normalize_public_url(url)
                      if normalized_url in sitemap_urls:
                          errors.append(f'sitemap.xml contains a duplicate URL: {url}')
                          continue
                      sitemap_urls.add(normalized_url)
                      sitemap_count += 1

                      target = resolve_existing_target(parsed.path or '/')
                      if target is None:
                          errors.append(f'sitemap.xml points to missing page: {url}')
                          continue

                      target_page = parsed_pages.get(target.resolve())
                      if target_page is None:
                          errors.append(f'sitemap.xml target could not be parsed as HTML: {url}')
                          continue

                      if 'noindex' in target_page['robots']:
                          errors.append(f'sitemap.xml contains a noindex page: {url}')

                      canonicals = target_page['canonicals']
                      if len(canonicals) != 1:
                          errors.append(
                              f'{target.relative_to(ROOT)}: expected exactly one canonical, found {len(canonicals)}'
                          )
                      else:
                          canonical = canonicals[0]
                          canonical_parsed = urlparse(canonical)
                          if canonical_parsed.scheme != 'https' or canonical_parsed.netloc.lower() != SITE_HOST:
                              errors.append(
                                  f'{target.relative_to(ROOT)}: canonical is not on the HTTPS academy domain: {canonical}'
                              )
                          elif normalize_public_url(canonical) != normalized_url:
                              errors.append(
                                  f'{target.relative_to(ROOT)}: canonical {canonical!r} does not match sitemap URL {url!r}'
                              )
              except Exception as exc:
                  errors.append(f'sitemap.xml could not be parsed: {exc}')

          # Catch discoverability regressions in the opposite direction too: a public,
          # self-canonical, indexable HTML page should not silently disappear from the sitemap.
          covered_indexable_pages = 0
          for html_file, page in parsed_pages.items():
              if 'noindex' in page['robots']:
                  continue
              if len(page['canonicals']) != 1:
                  continue

              canonical = page['canonicals'][0]
              canonical_parsed = urlparse(canonical)
              if canonical_parsed.scheme != 'https' or canonical_parsed.netloc.lower() != SITE_HOST:
                  continue

              canonical_url = normalize_public_url(canonical)
              file_url = public_url_for_file(html_file)
              if canonical_url != file_url:
                  continue

              covered_indexable_pages += 1
              if canonical_url not in sitemap_urls:
                  errors.append(
                      f'{html_file.relative_to(ROOT)}: indexable self-canonical page is missing from sitemap.xml '
                      f'({canonical_url})'
                  )

          if errors:
              print('Site health validation failed:')
              for error in errors:
                  print(f'  - {error}')
              sys.exit(1)

          print(
              f'Site health validation passed: '
              f'{len(html_files)} HTML files, {checked_links} internal references, '
              f'{checked_anchors} anchor references, {sitemap_count} sitemap URLs checked, '
              f'{covered_indexable_pages} indexable self-canonical pages covered by the sitemap.'
          )
          PY
