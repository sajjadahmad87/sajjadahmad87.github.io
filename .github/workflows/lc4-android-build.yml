name: Build LC4 Spare Parts Android Release

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-release:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore Android project
        run: |
          mkdir -p lc4-android-build
          cat lc4-android-release/source.part00 lc4-android-release/source.part01 lc4-android-release/source.part02 lc4-android-release/source.part03 | base64 --decode | tar -xz -C lc4-android-build

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 16 SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platform-tools' 'platforms;android-36' 'build-tools;36.0.0'

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Restore Google Play upload keystore from repository secrets
        working-directory: lc4-android-build
        env:
          LC4_UPLOAD_KEYSTORE_BASE64: ${{ secrets.LC4_UPLOAD_KEYSTORE_BASE64 }}
          LC4_UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.LC4_UPLOAD_KEYSTORE_PASSWORD }}
          LC4_UPLOAD_KEY_ALIAS: ${{ secrets.LC4_UPLOAD_KEY_ALIAS }}
          LC4_UPLOAD_KEY_PASSWORD: ${{ secrets.LC4_UPLOAD_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in LC4_UPLOAD_KEYSTORE_BASE64 LC4_UPLOAD_KEYSTORE_PASSWORD LC4_UPLOAD_KEY_ALIAS LC4_UPLOAD_KEY_PASSWORD; do
            if [[ -z "${!name:-}" ]]; then
              echo "Required Android signing secret $name is not configured."
              exit 1
            fi
          done
          mkdir -p signing
          printf '%s' "$LC4_UPLOAD_KEYSTORE_BASE64" | base64 --decode > signing/lc4-upload-key.jks
          cat > keystore.properties <<EOF
          storeFile=signing/lc4-upload-key.jks
          storePassword=$LC4_UPLOAD_KEYSTORE_PASSWORD
          keyAlias=$LC4_UPLOAD_KEY_ALIAS
          keyPassword=$LC4_UPLOAD_KEY_PASSWORD
          EOF
          keytool -list -v -keystore signing/lc4-upload-key.jks \
            -storepass "$LC4_UPLOAD_KEYSTORE_PASSWORD" -alias "$LC4_UPLOAD_KEY_ALIAS" | grep -E 'Alias name|SHA256'

      - name: Build signed Play AAB and test APK
        working-directory: lc4-android-build
        run: gradle --no-daemon clean bundleRelease assembleRelease

      - name: Verify release outputs
        working-directory: lc4-android-build
        run: |
          test -f app/build/outputs/bundle/release/app-release.aab
          test -f app/build/outputs/apk/release/app-release.apk
          sha256sum app/build/outputs/bundle/release/app-release.aab | tee app-release.aab.sha256
          sha256sum app/build/outputs/apk/release/app-release.apk | tee app-release.apk.sha256
          ls -lh app/build/outputs/bundle/release/app-release.aab app/build/outputs/apk/release/app-release.apk

      - name: Upload Play AAB
        uses: actions/upload-artifact@v4
        with:
          name: LC4-Spare-Parts-Play-AAB-v1.0.0
          path: |
            lc4-android-build/app/build/outputs/bundle/release/app-release.aab
            lc4-android-build/app-release.aab.sha256
          if-no-files-found: error
          retention-days: 90

      - name: Upload test APK
        uses: actions/upload-artifact@v4
        with:
          name: LC4-Spare-Parts-Test-APK-v1.0.0
          path: |
            lc4-android-build/app/build/outputs/apk/release/app-release.apk
            lc4-android-build/app-release.apk.sha256
          if-no-files-found: error
          retention-days: 90

      - name: Remove signing material from the runner
        if: always()
        working-directory: lc4-android-build
        run: |
          rm -f keystore.properties signing/lc4-upload-key.jks
