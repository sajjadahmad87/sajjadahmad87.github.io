name: LMS recovery tests

on:
  push:
    branches: [main]
    paths:
      - 'lms-import.js'
      - 'lms-logbook.js'
      - 'lms-course-notes.js'
      - 'tests/lms-recovery.test.mjs'
      - 'tests/lms-logbook-recovery.test.mjs'
      - 'tests/lms-course-notes.test.mjs'
      - '.github/workflows/lms-recovery-test.yml'
  pull_request:
    branches: [main]
    paths:
      - 'lms-import.js'
      - 'lms-logbook.js'
      - 'lms-course-notes.js'
      - 'tests/lms-recovery.test.mjs'
      - 'tests/lms-logbook-recovery.test.mjs'
      - 'tests/lms-course-notes.test.mjs'
      - '.github/workflows/lms-recovery-test.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recovery-round-trip:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Use Node.js 20
        uses: actions/setup-node@v5
        with:
          node-version: 20

      - name: Test LMS recovery and study note persistence
        run: node --test tests/*.test.mjs
