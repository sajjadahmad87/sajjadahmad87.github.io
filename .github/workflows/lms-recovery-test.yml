name: LMS automated tests

on:
  push:
    branches: [main]
    paths:
      - 'auth.js'
      - 'register.html'
      - 'lms-import.js'
      - 'lms.js'
      - 'lms-logbook.js'
      - 'lms-course-notes.js'
      - 'lms-quiz.js'
      - 'lms-quiz-rca.js'
      - 'lms-quiz-ppm.js'
      - 'lms-quiz-electrical.js'
      - 'courses.html'
      - 'marketplace.js'
      - 'course-catalog-filters.js'
      - 'tests/auth-registration.test.mjs'
      - 'tests/course-catalog-filters.test.mjs'
      - 'tests/lms-recovery.test.mjs'
      - 'tests/lms-logbook-recovery.test.mjs'
      - 'tests/lms-course-notes.test.mjs'
      - 'tests/lms-quiz.test.mjs'
      - 'tests/lms-course-progression.test.mjs'
      - '.github/workflows/lms-recovery-test.yml'
  pull_request:
    branches: [main]
    paths:
      - 'auth.js'
      - 'register.html'
      - 'lms-import.js'
      - 'lms.js'
      - 'lms-logbook.js'
      - 'lms-course-notes.js'
      - 'lms-quiz.js'
      - 'lms-quiz-rca.js'
      - 'lms-quiz-ppm.js'
      - 'lms-quiz-electrical.js'
      - 'courses.html'
      - 'marketplace.js'
      - 'course-catalog-filters.js'
      - 'tests/auth-registration.test.mjs'
      - 'tests/course-catalog-filters.test.mjs'
      - 'tests/lms-recovery.test.mjs'
      - 'tests/lms-logbook-recovery.test.mjs'
      - 'tests/lms-course-notes.test.mjs'
      - 'tests/lms-quiz.test.mjs'
      - 'tests/lms-course-progression.test.mjs'
      - '.github/workflows/lms-recovery-test.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lms-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Use Node.js 20
        uses: actions/setup-node@v5
        with:
          node-version: 20

      - name: Test LMS data and interactions
        run: node --test tests/*.test.mjs
