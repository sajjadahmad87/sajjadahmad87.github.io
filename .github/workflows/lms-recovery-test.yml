name: LMS recovery tests

on:
  push:
    branches: [main]
    paths:
      - 'lms-import.js'
      - 'tests/lms-recovery.test.mjs'
      - '.github/workflows/lms-recovery-test.yml'
  pull_request:
    branches: [main]
    paths:
      - 'lms-import.js'
      - 'tests/lms-recovery.test.mjs'
      - '.github/workflows/lms-recovery-test.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recovery-round-trip:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Test LMS recovery validation and rollback
        run: node --test tests/lms-recovery.test.mjs
