name: LMS automated tests

on:
  push:
    branches: [main]
    paths:
      - 'auth.js'
      - 'register.html'
      - 'lms-import.js'
      - 'lms.js'
      - 'lms-logbook.js'
      - 'lms-course-notes.js'
      - 'lms-strategy-outcomes.js'
      - 'lms-role-weekly-plan.js'
      - 'lms-quiz.js'
      - 'lms-quiz-rca.js'
      - 'lms-quiz-ppm.js'
      - 'lms-quiz-electrical.js'
      - 'lms-quiz-plc.js'
      - 'quiz-plc.html'
      - 'course.html'
      - 'courses.html'
      - 'free-video-courses.html'
      - 'marketplace.js'
      - 'pages.js'
      - 'course-catalog-filters.js'
      - 'course-catalog-actions.js'
      - 'tests/auth-registration.test.mjs'
      - 'tests/course-catalog-filters.test.mjs'
      - 'tests/course-catalog-actions.test.mjs'
      - 'tests/lms-recovery.test.mjs'
      - 'tests/lms-dom-safety.test.mjs'
      - 'tests/lms-logbook-recovery.test.mjs'
      - 'tests/lms-course-notes.test.mjs'
      - 'tests/lms-quiz.test.mjs'
      - 'tests/lms-course-progression.test.mjs'
      - 'tests/hvac-learning-path.test.mjs'
      - 'tests/free-video-courses.test.mjs'
      - 'tests/plc-troubleshooting-guide-depth.test.mjs'
      - 'tests/reduced-motion.test.mjs'
      - 'styles.css'
      - 'pages.css'
      - 'guide.css'
      - 'guides/**/*.html'
      - 'tools/**/*.html'
      - 'resources/**/*.html'
      - 'resource-library/**/*.html'
      - 'tests/guide-css-performance.test.mjs'
      - 'tests/ppm-resource-discovery.test.mjs'
      - 'tests/resource-library-accessibility.test.mjs'
      - 'tests/public-crawl-integrity.test.mjs'
      - 'resources.html'
      - 'student-dashboard.html'
      - 'lms.css'
      - '.github/workflows/lms-recovery-test.yml'
  pull_request:
    branches: [main]
    paths:
      - 'auth.js'
      - 'register.html'
      - 'lms-import.js'
      - 'lms.js'
      - 'lms-logbook.js'
      - 'lms-course-notes.js'
      - 'lms-strategy-outcomes.js'
      - 'lms-role-weekly-plan.js'
      - 'lms-quiz.js'
      - 'lms-quiz-rca.js'
      - 'lms-quiz-ppm.js'
      - 'lms-quiz-electrical.js'
      - 'lms-quiz-plc.js'
      - 'quiz-plc.html'
      - 'course.html'
      - 'courses.html'
      - 'free-video-courses.html'
      - 'marketplace.js'
      - 'pages.js'
      - 'course-catalog-filters.js'
      - 'course-catalog-actions.js'
      - 'tests/auth-registration.test.mjs'
      - 'tests/course-catalog-filters.test.mjs'
      - 'tests/course-catalog-actions.test.mjs'
      - 'tests/lms-recovery.test.mjs'
      - 'tests/lms-dom-safety.test.mjs'
      - 'tests/lms-logbook-recovery.test.mjs'
      - 'tests/lms-course-notes.test.mjs'
      - 'tests/lms-quiz.test.mjs'
      - 'tests/lms-course-progression.test.mjs'
      - 'tests/hvac-learning-path.test.mjs'
      - 'tests/free-video-courses.test.mjs'
      - 'tests/plc-troubleshooting-guide-depth.test.mjs'
      - 'tests/reduced-motion.test.mjs'
      - 'styles.css'
      - 'pages.css'
      - 'guide.css'
      - 'guides/**/*.html'
      - 'tools/**/*.html'
      - 'resources/**/*.html'
      - 'resource-library/**/*.html'
      - 'tests/guide-css-performance.test.mjs'
      - 'tests/ppm-resource-discovery.test.mjs'
      - 'tests/resource-library-accessibility.test.mjs'
      - 'tests/public-crawl-integrity.test.mjs'
      - 'resources.html'
      - 'student-dashboard.html'
      - 'lms.css'
      - '.github/workflows/lms-recovery-test.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lms-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Use Node.js 20
        uses: actions/setup-node@v5
        with:
          node-version: 20

      - name: Test LMS data and interactions
        run: node --test tests/*.test.mjs
