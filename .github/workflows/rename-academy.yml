name: Rename academy branding

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/rename-academy.yml'

permissions:
  contents: write

jobs:
  rename:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Replace academy name everywhere
        run: |
          python - <<'PY'
          from pathlib import Path

          old = "Sajjad Engineering Academy"
          new = "Sajjad's Engineering Academy"
          workflow = Path('.github/workflows/rename-academy.yml')
          changed = []

          for path in Path('.').rglob('*'):
              if not path.is_file() or '.git' in path.parts or path == workflow:
                  continue
              try:
                  text = path.read_text(encoding='utf-8')
              except (UnicodeDecodeError, OSError):
                  continue
              if old in text:
                  path.write_text(text.replace(old, new), encoding='utf-8')
                  changed.append(str(path))

          print(f'Updated {len(changed)} files')
          for item in changed:
              print(item)
          PY

      - name: Remove one-time workflow and commit changes
        run: |
          rm -f .github/workflows/rename-academy.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes required"
            exit 0
          fi
          git commit -m "Rename academy to Sajjad's Engineering Academy"
          git push
